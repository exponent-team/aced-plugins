name: Build

# Rebuild the `build` branch from `main`: copy shared/skills into every plugin.
# Both marketplaces install plugins from the `build` branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for plugin in plugins/*/; do
            mkdir -p "${plugin}skills"
            cp -R shared/skills/. "${plugin}skills/"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B build
          git add -A
          git commit --allow-empty -m "Build from ${GITHUB_SHA::7}"
          git push -f origin build
